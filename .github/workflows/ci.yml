name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      model-parity:
        description: "Run production-weight GPU parity (downloads the checkpoint and installs PyTorch)"
        type: boolean
        default: false
      d1-parity:
        description: "Run d1-omni-600M tokenizer and GPU parity (downloads the 2.3 GB snapshot)"
        type: boolean
        default: false

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build

      - name: Run Swift tests
        run: swift test

      - name: Run Python fixture tests
        run: python3 -m unittest discover -s Tests -p 'test_*.py'

      - name: Validate shell scripts
        run: bash -n tools/*.sh

  ios-harness:
    name: Build iOS harness
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build SystemOneHarness for iOS devices
        run: |
          xcodebuild build \
            -project Examples/SystemOneHarness/SystemOneHarness.xcodeproj \
            -scheme SystemOneHarness \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/xcode-ios \
            CODE_SIGNING_ALLOWED=NO

  model-parity:
    name: Production-weight GPU parity
    if: github.event_name == 'workflow_dispatch' && inputs.model-parity
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install conversion dependencies
        run: pip install torch==2.14.0 safetensors==0.8.0

      - name: Download pinned checkpoint
        run: python3 tools/download_model.py

      - name: Verify downloaded checkpoint
        run: python3 tools/download_model.py --check

      - name: Convert to safetensors
        run: python3 tools/convert_option_marker.py --source weights/option_marker.pt

      - name: Verify converted artifact
        run: python3 tools/convert_option_marker.py --check

      - name: Build Xcode test bundle
        run: |
          xcodebuild build-for-testing \
            -scheme SystemOne-Package \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Release \
            -derivedDataPath .build/xcode

      - name: Public API parity (GPU)
        env:
          VON_PUBLIC_API_PARITY: "1"
          VON_PUBLIC_API_DEVICE: gpu
          VON_PRODUCTION_WEIGHTS_PATH: "${{ github.workspace }}/weights/option_marker.safetensors"
        run: |
          xcrun xctest \
            -XCTest SystemOneVonTests.VonEngineTests/testProductionPublicAPIParityWhenConfigured \
            .build/xcode/Build/Products/Release/SystemOneVonTests.xctest

  d1-parity:
    name: d1-omni GPU parity
    if: github.event_name == 'workflow_dispatch' && inputs.d1-parity
    runs-on: macos-15
    env:
      D1_MODEL_FOLDER: "${{ github.workspace }}/weights/d1-omni-600M"
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download pinned d1-omni-600M snapshot
        run: |
          pip install "huggingface_hub>=1.0"
          hf download LiquidAI/d1-omni-600M \
            --revision 02b55d7076f15129e59ab3f94783f32c4b088674 \
            --local-dir "$D1_MODEL_FOLDER"

      - name: Tokenizer and prompt parity
        run: swift test --filter SystemOneD1Tests

      - name: Build Xcode test bundle
        run: |
          xcodebuild build-for-testing \
            -scheme SystemOne-Package \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Release \
            -derivedDataPath .build/xcode

      - name: Weight parity (GPU)
        env:
          D1_MODEL_PARITY: "1"
          D1_DEVICE: gpu
        run: |
          xcrun xctest -XCTest SystemOneD1Tests.D1TextTests,SystemOneD1Tests.D1VisionTests,SystemOneD1Tests.D1AudioTests,SystemOneD1Tests.D1HeadTrainingTests \
            .build/xcode/Build/Products/Release/SystemOneD1Tests.xctest
